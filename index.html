<title>Acceso restringido</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e4e7ec;--ac:#1f5fbf;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171c25;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#262d3a;--ac:#6ea0f5;--err:#f97066}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px}
h1{font-size:18px;margin:0 0 16px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
input,button{width:100%;padding:10px 12px;border-radius:8px;font:inherit}
input{border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{margin-top:12px;border:0;background:var(--ac);color:var(--card);font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#error{color:var(--err);font-size:13px;margin:10px 0 0;min-height:20px}
</style></head><body>

function bytes(b64){return Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)})}
async function descifrar(clave){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  var llave=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(CIFRADO.sal),iterations:CIFRADO.iteraciones},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plano=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(CIFRADO.iv)},llave,bytes(CIFRADO.texto));
  return new TextDecoder().decode(plano);
}
document.getElementById('acceso').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var boton=document.getElementById('entrar'),error=document.getElementById('error');
  boton.disabled=true;boton.textContent='Abriendo…';error.textContent='';
  try{
    var html=await descifrar(document.getElementById('clave').value.trim());
    document.open();document.write(html);document.close();
  }catch(e){
    error.textContent='Clave incorrecta.';boton.disabled=false;boton.textContent='Entrar';
  }
});
})();
